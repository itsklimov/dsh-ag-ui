# Apply this after the bundle layer to configure the Gateway explicitly.
- insert:
    - id: ag-ui
      name: dsh-ag-ui
      disabled: false
      config:
        provider: openai
        model: gpt-5.6-sol
        sharedSecret: !!js process.env.DSH_AG_UI_SHARED_SECRET
        path: /ag-ui

    - id: ag-ui-invariant
      name: dsh-ag-ui/invariant
      disabled: false
