- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: 127.0.0.1
    port: !!js Number(process.env.AG_UI_TEST_PORT)

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: Test AG-UI assistant.

- id: scripted-model
  name: './scripted-model.mjs'

# Load the built standalone entry through the real Cordis Loader.
- id: ag-ui
  name: '../../lib/index.js'
  config:
    provider: scripted
    model: scripted
    sharedSecret: test-only-ag-ui-shared-secret
    maxRunEvents: 128
    maxRunEventBytes: 131072
    frontendToolTimeoutMs: 10000
    threadIdleMs: 60000
