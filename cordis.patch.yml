# Browser Tool leasing is always available. The Gateway row stays dormant until
# all three required environment variables are configured by the deployment.
- insert:
    - id: browser-tools
      name: dsh-ag-ui/browser-tools
      config: {}
    - id: ag-ui
      name: dsh-ag-ui
      disabled: !!js >-
        !process.env.DSH_AG_UI_PROVIDER ||
        !process.env.DSH_AG_UI_MODEL ||
        !process.env.DSH_AG_UI_SHARED_SECRET
      config:
        provider: !!js process.env.DSH_AG_UI_PROVIDER
        model: !!js process.env.DSH_AG_UI_MODEL
        sharedSecret: !!js process.env.DSH_AG_UI_SHARED_SECRET
        path: !!js process.env.DSH_AG_UI_PATH || '/ag-ui'
